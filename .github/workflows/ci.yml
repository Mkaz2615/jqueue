name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # A real Redis for the integration suite: Lua atomicity, score ordering and TTLs are
    # exactly the things a fake cannot prove.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests
        run: ./mvnw -B test

      - name: Integration tests
        env:
          REDIS_ADDR: 127.0.0.1:6379
        run: ./mvnw -B test -Pintegration

      - name: Package
        run: ./mvnw -B -q package -DskipTests

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
