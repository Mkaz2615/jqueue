# Grafana dashboard provisioning: load every JSON dashboard mounted into
# /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: jqueue
    orgId: 1
    folder: JQueue
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
